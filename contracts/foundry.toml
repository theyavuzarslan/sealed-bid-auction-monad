[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Vendored OpenZeppelin stays exactly as upstream released it: never reformat or lint it.
[fmt]
ignore = ["src/vendor/**/*.sol"]

[lint]
ignore = ["src/vendor/**/*.sol"]

[fuzz]
runs = 512

[profile.deep.fuzz]
runs = 10000

# Invariant suite (test/invariant/). Kept small so the default `forge test` stays fast.
[invariant]
runs = 32
depth = 128
fail_on_revert = true
show_metrics = true

[profile.deep.invariant]
runs = 500
depth = 256
fail_on_revert = true
show_metrics = true

# Heavy scale tests (test/Scale.t.sol) run only under this profile; every other profile skips them.
#   FOUNDRY_PROFILE=scale forge test --match-contract ScaleMockTest
#   FOUNDRY_PROFILE=scale forge test --match-contract ScaleForkTest --fork-url https://rpc1.monad.xyz
# Monad execution rules: the same tests under the MonadTen hardfork (Monad gas schedule and
# execution rules). The default profile stays plain EVM so `forge test` is unchanged.
#   FOUNDRY_PROFILE=monad forge test
#   FOUNDRY_PROFILE=monad forge snapshot --snap reports/gas-snapshot-monad.txt
# Equivalent flags on any profile: forge test --network monad --hardfork monad:MonadTen
[profile.monad]
network = "monad"
hardfork = "monad:MonadTen"

[profile.scale]
verbosity = 2
gas_limit = "18446744073709551615"
memory_limit = 1073741824
