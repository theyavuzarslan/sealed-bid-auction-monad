[profile.default]
src = "src"
out = "out"
script = "script"
test = "test"
libs = ["../contracts/lib"]
# Match contracts/foundry.toml: the auction pane runs the real AuctionEngine from ../contracts/src.
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../contracts"]
remappings = [
  "forge-std/=../contracts/lib/forge-std/src/",
  "engine/=../contracts/src/",
  "engine-mocks/=../contracts/test/mocks/",
]
fs_permissions = [
  { access = "read-write", path = "./.scenario" },
  { access = "read-write", path = "./results.json" },
  { access = "read-write", path = "./fairness.json" },
]
